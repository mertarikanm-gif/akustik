<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="googlebot" content="noindex, indexifembedded">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.izofleks.com.tr/akustik-simulator">
<title>dBLAB · İzofleks Cam Bölme Akustik Simülatörü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B4B5A; --navy2:#2E6170; --ink:#2a2c2b; --mute:#77726b; --line:#e4dfd8; --soft:#efece6;
  --panel:rgba(251,250,247,.97); --accent:#a0634e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Jost,Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);
  background:radial-gradient(120% 90% at 70% 30%,#fbfaf8 0%,#efebe6 55%,#e4ded7 100%)}
#wrap{position:relative;width:100%;height:100%;min-height:600px;overflow:hidden}
#c{position:absolute;inset:0;display:block;width:100%;height:100%;cursor:grab}
#c:active{cursor:grabbing}
button{font-family:inherit}

/* panel */
.panel{position:absolute;top:16px;left:16px;bottom:16px;width:352px;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid rgba(255,255,255,.8);border-radius:18px;
  box-shadow:0 20px 50px -12px rgba(45,42,36,.22),0 2px 6px rgba(45,42,36,.06);overflow:hidden}
.ph{padding:16px 18px 14px;background:linear-gradient(135deg,#55666a 0%,#6f8180 100%);color:#fff}
.brandrow{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:700;letter-spacing:3px;font-size:12px}.izlogo{height:30px;width:auto;display:inline-block;vertical-align:middle;margin-right:8px}.izlogo .izl1{fill:#fff}.izlogo .izl2{fill:#d3dbd7}
.badge{font-size:10px;font-weight:600;letter-spacing:.4px;margin-left:8px;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,.16)}
.lang{display:flex;background:rgba(255,255,255,.14);border-radius:20px;padding:2px}
.lang button{border:0;background:transparent;color:#e8edeb;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;cursor:pointer}
.lang button.on{background:#fff;color:var(--navy)}
.ph h1{font-size:17px;font-weight:600;margin:12px 0 4px;letter-spacing:-.1px}
.ph p{font-size:11.5px;line-height:1.45;margin:0;color:#e1e8e5}
.pb{padding:4px 18px 16px;overflow:auto;flex:1}
.pb::-webkit-scrollbar{width:6px}.pb::-webkit-scrollbar-thumb{background:#d8d2c8;border-radius:4px}

.step{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mute)}
.step .n{font-size:10px;color:var(--navy);background:#e2eae8;border-radius:5px;padding:2px 5px;letter-spacing:0}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.seg.three{grid-template-columns:repeat(4,1fr)}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;cursor:pointer;text-align:center;color:var(--mute);transition:.18s}
.seg button b{display:block;font-size:13px;color:var(--ink);font-weight:600}
.seg button small{display:block;font-size:10.5px;margin-top:2px}
.seg.three button{font-size:11.5px;font-weight:600;color:var(--ink);padding:8px 4px;line-height:1.25}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(45,42,36,.14),0 0 0 1px rgba(27,75,90,.12)}
.seg button.on b,.seg.three button.on{color:var(--navy)}

.list{display:flex;flex-direction:column;gap:5px}
.it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;transition:.15s;color:var(--ink);font-size:12.5px}
.it:hover{border-color:#cbc4b9}
.it .dot{width:14px;height:14px;border-radius:50%;border:1.5px solid #bfb8ad;flex:0 0 auto;position:relative}
.it.on{border-color:var(--navy);background:#f2f5f3}
.it.on .dot{border-color:var(--navy)}
.it.on .dot:after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--navy)}
.it .nm{flex:1}
.it .nm small{display:block;color:var(--mute);font-size:10.5px;margin-top:1px}
.rw{font-size:11px;font-weight:700;color:var(--navy);background:#e2eae8;border-radius:6px;padding:3px 6px;white-space:nowrap}

.secbox{display:flex;gap:12px;align-items:center;margin-top:10px;padding:10px;border-radius:12px;background:var(--soft)}
.secbox svg{flex:0 0 auto}
.secbox div{font-size:11px;color:var(--mute);line-height:1.45}
.secbox b{color:var(--ink);font-weight:600}
.doorDesc{font-size:11px;color:var(--mute);margin-top:6px;line-height:1.45}

.chips{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 9px;cursor:pointer;text-align:left;font-size:11.5px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:6px;transition:.15s}
.chip b{font-size:11px;color:var(--mute)}
.chip.on{border-color:var(--accent);background:#fdf5f2}
.chip.on b{color:var(--accent)}

.res{margin-top:16px;border-radius:14px;border:1px solid var(--line);padding:14px;background:linear-gradient(180deg,#fff 0%,#f8f7f4 100%)}
.big{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.big small{font-size:10.5px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
.num{font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1.05;margin-top:2px}
.num span{font-size:13px;font-weight:600;letter-spacing:0;margin-left:3px;color:var(--mute)}
.verdict{font-size:11.5px;font-weight:600;padding:6px 9px;border-radius:8px;max-width:160px;text-align:right;line-height:1.3}
.meter{position:relative;height:44px;margin:14px 0 4px}
.meter .bar{position:absolute;left:0;right:0;top:20px;height:8px;border-radius:5px;opacity:.9;
  background:linear-gradient(90deg,#717b99 0%,#8bb8bf 25%,#91bb9d 45%,#e7dead 65%,#d1ae90 82%,#af7878 100%)}
.mk{position:absolute;top:0;transform:translateX(-50%);font-size:10px;font-weight:700;white-space:nowrap;transition:left .5s cubic-bezier(.2,.8,.2,1)}
.mk:after{content:"";position:absolute;left:var(--p,50%);top:15px;width:2px;height:18px;margin-left:-1px;background:currentColor;border-radius:2px}
.mk.bg{top:auto;bottom:-14px;color:#857e74;font-weight:600}
.mk.bg:after{top:-22px;height:16px;width:0;border-left:2px dotted #857e74;background:none}
.rows{margin-top:18px;border-top:1px solid var(--line);padding-top:8px}
.row{display:flex;justify-content:space-between;font-size:12px;padding:3.5px 0;color:var(--mute)}
.row span:last-child{font-weight:600;color:var(--ink)}
.row.k span:last-child{color:var(--navy);font-weight:700}
.weak{display:none;margin-top:10px;font-size:11.2px;line-height:1.4;padding:8px 10px;border-radius:9px;background:#fff4e5;color:#8a4b0b;border:1px solid #fbdcb2}

.tog{display:flex;gap:16px;margin-top:14px}
.sw{display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer;user-select:none}
.sw input{display:none}
.sw i{width:30px;height:17px;border-radius:10px;background:#d3cdc4;position:relative;transition:.2s}
.sw i:after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked+i{background:var(--navy)}
.sw input:checked+i:after{left:15px}
.basis{margin-top:14px;border:1px solid #f0dcc0;background:#fffaf2;border-radius:12px;padding:10px 12px}
.basis summary{font-size:11.5px;font-weight:700;color:#8a4b0b;cursor:pointer;letter-spacing:.2px}
.basis ul{margin:8px 0 0;padding-left:16px}
.basis li{font-size:10.6px;color:#5b4a36;line-height:1.5;margin-bottom:5px}
.basis b{color:#3d2f1f}
.tog{flex-wrap:wrap}
.cta{display:flex;justify-content:center;align-items:center;margin-top:12px;padding:10px;border-radius:10px;background:var(--navy);color:#fff;font-size:12px;font-weight:600;text-decoration:none;transition:.15s}
.cta:hover{background:var(--navy2)}

/* overlay */
.legend{position:absolute;right:16px;bottom:16px;background:var(--panel);border-radius:12px;padding:9px 12px;font-size:10.5px;color:var(--mute);box-shadow:0 8px 24px -8px rgba(45,42,36,.2)}
.legend .bar{width:220px;height:8px;border-radius:5px;margin:6px 0 4px;background:linear-gradient(90deg,#717b99 0%,#8bb8bf 25%,#91bb9d 45%,#e7dead 65%,#d1ae90 82%,#af7878 100%)}
.legend .ticks{display:flex;justify-content:space-between}
.tools{position:absolute;right:16px;top:16px;display:flex;gap:6px;align-items:center}
.hint{font-size:11px;color:var(--mute);background:var(--panel);border-radius:9px;padding:6px 10px;box-shadow:0 4px 14px -6px rgba(45,42,36,.2)}
.reset{border:0;background:var(--panel);border-radius:9px;padding:6px 10px;font-size:11px;font-weight:600;color:var(--navy);cursor:pointer;box-shadow:0 4px 14px -6px rgba(45,42,36,.2)}

.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap;
  background:rgba(255,255,255,.96);border-radius:10px;padding:5px 9px 5px 9px;font-size:13px;font-weight:700;
  box-shadow:0 6px 16px -6px rgba(45,42,36,.3)}
.tag:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:rgba(255,255,255,.96)}
.tag small{display:block;font-weight:500;color:var(--mute);font-size:10px;letter-spacing:.2px}
.tag.door{font-size:11.5px;color:#8a4b0b}

@media (max-width:720px){
  .panel{top:auto;left:0;right:0;bottom:0;width:auto;height:56%;border-radius:18px 18px 0 0}
  .ph{padding:12px 16px 10px}.ph p{display:none}.ph h1{font-size:15px;margin:8px 0 0}
  .legend,.hint{display:none}
  .tools{top:10px;right:10px}
}
/* ===== v8 ekleri ===== */
.card{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:12px 13px;background:#fff}
.card h4{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h4 em{font-style:normal;font-weight:600;letter-spacing:0;text-transform:none;font-size:10.5px;color:#948d83}
.goal{margin-top:12px;border:1px solid #d8e2df;border-radius:14px;background:#f4f6f4;padding:0 12px}
.goal summary{list-style:none;cursor:pointer;padding:11px 0;font-size:12px;font-weight:700;color:var(--navy);display:flex;justify-content:space-between;align-items:center}
.goal summary::-webkit-details-marker{display:none}
.goal summary:after{content:"+";font-size:16px;font-weight:500;color:var(--navy2)}
.goal[open] summary:after{content:"–"}
.goal .gx{padding:0 0 12px}
.goal p{font-size:10.8px;color:var(--mute);margin:0 0 8px;line-height:1.45}
.gchips{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.gchips button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 9px;cursor:pointer;text-align:left;font-size:11.5px;color:var(--ink);line-height:1.25}
.gchips button small{display:block;color:var(--mute);font-size:10px;margin-top:2px}
.gchips button.on{border-color:var(--navy);background:#fff;box-shadow:0 0 0 1px var(--navy) inset}
.gres{margin-top:9px;font-size:11.4px;line-height:1.5;color:var(--ink);background:#fff;border-radius:10px;padding:9px 10px;border:1px solid var(--line)}
.gres b{color:var(--navy)}
.gres .no{color:#8a4b0b}
.gres button{margin-top:8px;width:100%;border:0;border-radius:8px;background:var(--navy);color:#fff;font-size:11.5px;font-weight:600;padding:7px;cursor:pointer}
.pv .pbar{position:relative;height:10px;border-radius:6px;overflow:hidden;display:flex;margin:22px 0 6px}
.pv .pbar i{display:block;height:100%}
.pv .pmk{position:absolute;top:-20px;transform:translateX(-50%);font-size:10.5px;font-weight:700;white-space:nowrap;transition:left .5s cubic-bezier(.2,.8,.2,1)}
.pv .pmk:after{content:"";position:absolute;left:50%;top:15px;width:2px;height:16px;margin-left:-1px;background:currentColor;border-radius:2px}
.pv .pwrap{position:relative}
.pv .plab{display:flex;font-size:9.6px;color:var(--mute)}
.pv .plab span{text-align:center}
.pv .pres{margin-top:8px;font-size:12px;font-weight:700;padding:7px 9px;border-radius:8px}
.pv .pres small{display:block;font-weight:500;font-size:10.4px;margin-top:2px;opacity:.85}
.oleg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:10px;color:var(--mute)}
.oleg span{display:flex;align-items:center;gap:5px}
.oleg i{display:inline-block;width:14px;height:0;border-top:2px solid}
.onote{font-size:9.8px;color:#948d83;margin-top:5px;line-height:1.4}
.lbtns{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.lbtns.three{grid-template-columns:1fr 1fr 1fr}
.lb{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 6px;cursor:pointer;font-size:11.3px;font-weight:600;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;line-height:1.2;text-align:center}
.lb:before{content:"";border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent;flex:0 0 auto}
.lb.on{background:var(--navy);border-color:var(--navy);color:#fff}
.lb.on:before{border:0;width:8px;height:10px;border-left:3px solid #fff;border-right:3px solid #fff;box-sizing:border-box}
.lb.b{color:var(--accent)}.lb.b.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lnote{font-size:10.2px;color:var(--mute);margin-top:7px;line-height:1.45}
.cmpt{width:100%;border-collapse:collapse;font-size:11px}
.cmpt th{font-size:10px;text-align:right;color:var(--mute);font-weight:700;padding:3px 0 5px}
.cmpt th:first-child{text-align:left}
.cmpt th.a{color:var(--navy)}.cmpt th.b{color:var(--accent)}
.cmpt td{padding:4px 0;border-top:1px solid var(--line);color:var(--mute);vertical-align:top}
.cmpt td+td{text-align:right;color:var(--ink);font-weight:600;padding-left:8px}
.cmpt tr.k td+td{color:var(--navy);font-weight:700}
.cbtns{display:flex;gap:6px;margin-top:9px}
.cbtns button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 6px;font-size:11px;font-weight:600;color:var(--navy);cursor:pointer}
.cbtns button.pin{border-color:var(--accent);color:var(--accent)}
.acts{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:6px;padding:10px 14px 12px;border-top:1px solid var(--line);background:#fff;position:relative}
.acts button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 6px;font-size:11.5px;font-weight:600;color:var(--navy);cursor:pointer;line-height:1.2}
.acts button.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.acts button.pri:hover{background:var(--navy2)}
.dlm{display:none;position:absolute;left:14px;right:14px;bottom:100%;margin-bottom:6px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px -10px rgba(45,42,36,.3);padding:6px}
.dlm.on{display:block}
.dlm a{display:block;padding:8px 9px;border-radius:8px;font-size:11.5px;color:var(--ink);text-decoration:none}
.dlm a:hover{background:var(--soft)}
.dlm a small{display:block;color:var(--mute);font-size:10px;margin-top:1px}

function shapesOf(key,part,cu,cv){
  const ck=key+part+cu+cv; if(shapeCache[ck])return shapeCache[ck];
  const list=(PD[key][part]||[]).map(p=>{const s=new THREE.Shape(p.o.map(q=>new THREE.Vector2((q[0]-cu)/1000,(q[1]-cv)/1000)));
    p.h.forEach(h=>s.holes.push(new THREE.Path(h.map(q=>new THREE.Vector2((q[0]-cu)/1000,(q[1]-cv)/1000)))));return s;});
  return shapeCache[ck]=list;}

function prof(key,L,o,u,v,w,cu,cv,mt){
  if(L<=0.001)return;
  const M=new THREE.Matrix4().makeBasis(new THREE.Vector3(...u),new THREE.Vector3(...v),new THREE.Vector3(...w)).setPosition(new THREE.Vector3(...o));
  [['al',alu],['eg',rubberM]].forEach(([part,mat])=>{const sh=shapesOf(key,part,cu||0,cv||0);if(!sh.length)return;
    const g=new THREE.ExtrudeGeometry(sh,{depth:L,bevelEnabled:false,curveSegments:3});
    if(mt&&(mt[0]||mt[1])){const p=g.attributes.position,y0=-(cv||0)/1000;for(let i=0;i<p.count;i++){const z=p.getZ(i),y=p.getY(i)-y0;
      if(mt[0]&&z<1e-6)p.setZ(i,Math.min(y,L/2));else if(mt[1]&&z>L-1e-6)p.setZ(i,L-Math.min(y,L/2));}p.needsUpdate=true;g.computeVertexNormals();}
    g.applyMatrix4(M);
    const m=new THREE.Mesh(g,mat);m.castShadow=part==='al';if(w[1]===1&&w[0]===0&&w[2]===0)m.userData.pl={key,part,cu:cu||0,cv:cv||0,M};partition.add(m);});
}
function glassSlab(cx,za,zb,ya,yb,SK){ // cx: camın orta düzlemi
  const g={sk:SK||glass().sk}; const ws=g.sk.map(p=>Math.max(p[0]/1000,0.0008)), tot=ws.reduce((a,b)=>a+b,0);
  let x=cx-tot/2; const D=zb-za, Hh=yb-ya, zc=(za+zb)/2, yc=(ya+yb)/2;
  box(tot,Hh,D,glassM,cx,yc,zc);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(tot,Hh,D)),edgeM);e.position.set(cx,yc,zc);partition.add(e);
  return tot;
}

      [t.rGlass,A.rg+' dB',B.rg+' dB'],[t.rDoor,A.rd!==null?A.rd+' dB':'—',B.rd!==null?B.rd+' dB':'—'],
      [x.k_rc,fx(A.rc)+' dB',fx(B.rc)+' dB','k'],[x.k_pv,x.pvR[pvA].split(' — ')[0],x.pvR[pvB].split(' — ')[0]],[x.k_l2+' ('+src[lang]+')','≈ '+Math.round(A.lr)+' dB','≈ '+Math.round(B.lr)+' dB']];

      `</table><div class="lnote">Δ Rw (A − B): <b style="color:${d>=0?'#1f6b45':'#b42318'}">${d>=0?'+':''}${fx(d)} dB</b></div>`;
    
    const cl=el('button','',x.cClear);cl.onclick=()=>{pinB=null;renderExtra();};bt.appendChild(cl);
  }

/* ---- PDF rapor: sistem kesiti (yatay / plan) — 3B modelin h=0,9 m'de kesilmesiyle üretilir ---- */
function planSVG(){
  const l=lang, HC=0.9, sd=SDEF[sys], kk=!!sd.kkb, hasDoor=door.id!=='none', wood=door.id==='wood'||door.id==='acoustic';
  if(anim){anim=null;if(leafG)leafG.rotation.y=0;kkbPanels.forEach(p=>{p.g.rotation.y=0;p.g.position.x=0;p.g.position.z=p.i*p.pw;});renderer.shadowMap.needsUpdate=true;window.__dirty=true;}
  partition.updateMatrixWorld(true);
  const items=[]; const v3=new THREE.Vector3();
  partition.traverse(o=>{if(!o.isMesh)return;const u=o.userData;
    if(u.pl){const M=new THREE.Matrix4().multiplyMatrices(o.matrixWorld,u.pl.M);
      (PD[u.pl.key][u.pl.part]||[]).forEach(p=>{const pt=q=>{v3.set((q[0]-u.pl.cu)/1000,(q[1]-u.pl.cv)/1000,0).applyMatrix4(M);return [v3.z,v3.x];};
        items.push({t:u.pl.part,rings:[p.o.map(pt),...(p.h||[]).map(h=>h.map(pt))]});});}
    else if(u.bx){const b=u.bx;const c=new THREE.Vector3().setFromMatrixPosition(o.matrixWorld);if(Math.abs(c.y-HC)>b.h/2)return;
      const pts=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,d])=>{v3.set(a*b.w/2,0,d*b.d/2).applyMatrix4(o.matrixWorld);return [v3.z,v3.x];});
      const m=o.material, t=m===glassM?'gl':m===woodM?'wd':m===jointM?'jt':m===rubberM?'eg':m===alu?'al':m===handleM?'hd':null; if(t)items.push({t,rings:[pts]});}
  });
  const ST={al:'fill="#dfe2e4" stroke="#5f656b" stroke-width="0.35"',eg:'fill="#1b1b1b"',gl:'fill="#d5eadb" stroke="#6f9c80" stroke-width="0.3"',
    wd:'fill="#6b4a33" stroke="#3b2416" stroke-width="0.3"',jt:'fill="#f3fafb" stroke="#8fb7c2" stroke-width="0.3"',hd:'fill="#c9cdd2" stroke="#7b8187" stroke-width="0.3"'};
  const ORD=['gl','jt','wd','al','hd','eg'];
  function detail(title,z0,z1,wall){
    const xr=Math.max(sd.w/1000/2+0.022,0.05), W=(z1-z0)*1000, Hh=2*xr*1000, id='c'+Math.random().toString(36).slice(2,7);
    const X=z=>((z-z0)*1000).toFixed(2), Y=x=>((x+xr)*1000).toFixed(2);
    let h=`<svg viewBox="0 0 ${W.toFixed(1)} ${(Hh+9).toFixed(1)}" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block">
      <defs><clipPath id="${id}"><rect x="0" y="0" width="${W.toFixed(1)}" height="${Hh.toFixed(1)}"/></clipPath>
      <pattern id="${id}h" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="4" stroke="#8a857d" stroke-width="0.5"/></pattern></defs><g clip-path="url(#${id})">`;
    if(wall)h+=`<rect x="${X(-RZ-0.2)}" y="0" width="${((0.2)*1000).toFixed(1)}" height="${Hh.toFixed(1)}" fill="url(#${id}h)" stroke="#6d6860" stroke-width="0.4"/>`;
    ORD.forEach(t=>items.filter(i=>i.t===t).forEach(i=>{
      if(i.rings[0].every(p=>p[0]<z0-0.002)||i.rings[0].every(p=>p[0]>z1+0.002))return;
      h+=`<path d="${i.rings.map(r=>'M'+r.map(p=>X(p[0])+' '+Y(p[1])).join('L')+'Z').join('')}" fill-rule="evenodd" ${ST[t]}/>`;
      if(t==='gl'){const xs=i.rings[0].map(p=>p[1]),zs=i.rings[0].map(p=>p[0]),a=Math.min(...xs),b=Math.max(...xs),za=Math.min(...zs),zb=Math.max(...zs);const SK=glass().sk,tot=SK.reduce((q,p)=>q+p[0],0)/1000;
        if(SK.length>1&&Math.abs((b-a)-tot)<0.0012){let x=a;SK.forEach(p=>{if(p[1]!=='g')h+=`<rect x="${X(za)}" y="${Y(x)}" width="${((zb-za)*1000).toFixed(2)}" height="${Math.max(p[0],0.5).toFixed(2)}" fill="${p[1]==='a'?'#e57f9a':'#f0c75e'}"/>`;x+=p[0]/1000;});}}}));
    // kesit çizgisi uçları (kırık çizgi işaretleri)
    h+=`</g><rect x="0" y="0" width="${W.toFixed(1)}" height="${Hh.toFixed(1)}" fill="none" stroke="#c9c3b9" stroke-width="0.3" stroke-dasharray="2 1.5"/>`;
    h+=`<text x="0" y="${(Hh+7).toFixed(1)}" font-size="5.2" font-weight="600" fill="#2a2c2b" font-family="Jost,Inter,Arial">${title}</text>`;
    h+=`<text x="${W.toFixed(1)}" y="${(Hh+7).toFixed(1)}" font-size="4.4" fill="#77726b" text-anchor="end" font-family="Jost,Inter,Arial">${l==='tr'?'ölçek ≈ 1:2 · h = 90 cm':'scale ≈ 1:2 · h = 90 cm'}</text></svg>`;
    return h;}
  const out=[];
  if(kk){const n=6,gap=0.003,pw=(2*RZ-gap*(n-1))/n;
    out.push(detail(l==='tr'?'Duvar – kanat birleşimi':'Wall – leaf junction',-RZ-0.04,-RZ+0.2,true));
    out.push(detail(l==='tr'?'Kanat – kanat birleşimi (menteşe hattı)':'Leaf – leaf joint (hinge line)',-RZ+pw-0.11,-RZ+pw+0.13,false));}
  else if(hasDoor){const z0=DOORZ-DW/2;
    out.push(detail(l==='tr'?`Kapı kasası – bölme birleşimi (${sys==='A100'?'A100 kasa':'D53 kasa'} · ${wood?(l==='tr'?'ahşap kanat':'timber leaf'):(l==='tr'?'cam kanat':'glass leaf')})`:`Door frame – partition junction`,z0-0.16,z0+0.12,false));}
  else{let jz=null;items.forEach(i=>{if(i.t==='jt'){const zc=(i.rings[0][0][0]+i.rings[0][2][0])/2;if(jz===null||Math.abs(zc)<Math.abs(jz))jz=zc;}});
    if(jz===null)jz=0;
    out.push(detail(l==='tr'?'Cam – cam birleşimi (sabit bölme)':'Glass – glass joint (fixed partition)',jz-0.12,jz+0.12,false));}
  const lg=[['al',l==='tr'?'alüminyum profil':'aluminium profile'],['gl',l==='tr'?'cam':'glass'],['eg',l==='tr'?'EPDM fitil':'EPDM seal']];
  if(!kk&&!hasDoor)lg.push(['jt',l==='tr'?'şeffaf birleşim':'clear joint']); if(hasDoor&&wood)lg.push(['wd',l==='tr'?'ahşap kanat':'timber leaf']);
  const leg='<div class="leg">'+lg.map(([t,n])=>`<span><svg width="12" height="8"><rect x="0.5" y="0.5" width="11" height="7" ${ST[t].replace(/stroke-width="[^"]*"/,'stroke-width="0.8"')}/></svg>${n}</span>`).join('')+'</div>';
  return out.map(d=>`<div class="pln">${d}</div>`).join('')+leg;
}
function reportHTML(){
  const l=lang,x=X[l],t=T[l],A=cfgOf(cur()),B=pinB?cfgOf(pinB):null;
  const plan=planSVG();
  const pv=pvCls(A.pf),date=new Date().toLocaleDateString(l==='tr'?'tr-TR':'en-GB');
  const sec=$('#secSvg').outerHTML.replace(/width="112" height="74"/,'width="260" height="172"');
  const kv=rows=>'<table class="kv">'+rows.map(r=>`<tr${r[2]?' class="k"':''}><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')+'</table>';
  const cfgT=kv([[x.k_sys,A.c.sys+' – '+SYS[A.c.sys][l]],[x.k_glass,A.g[l]],[x.k_door,A.c.door[l]],...(A.c.door.id!=='none'?[[t.gytLbl,A.c.gyt?t.gytYes:t.gytNo]]:[]),[x.k_src,src[l]+' · '+src.L+' dB(A)']]);
  const resT=kv([[t.rGlass,A.rg+' dB'],[t.rDoor,A.rd!==null?A.rd+' dB':'—'],[t.rComp,'≈ '+fx(A.rc)+' dB',1],[x.pvF,Math.round(A.pf)+' · '+x.pvR[pv]],[x.k_l2,'≈ '+Math.round(A.lr)+' dB(A) · '+t[A.v]]]);
  let cmp='';
  if(B){const gl=c=>GLASS[c.sys][c.gi][l];cmp=`<h3>${x.rCmp}</h3><table class="cm"><tr><th></th><th>A</th><th>B</th></tr>`+
    [[x.k_sys,A.c.sys,B.c.sys],[x.k_glass,gl(A.c),gl(B.c)],[x.k_door,doorTxt(A.c,l),doorTxt(B.c,l)],[x.k_rc,'≈ '+fx(A.rc)+' dB','≈ '+fx(B.rc)+' dB'],[x.k_pv,x.pvR[pvCls(A.pf)],x.pvR[pvCls(B.pf)]]]
    .map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')+'</table>';}
  const css=`@page{size:A4;margin:14mm 13mm}*{box-sizing:border-box}body{margin:0;font-family:Jost,Inter,Arial,sans-serif;color:#2a2c2b;font-size:10.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #1B4B5A;padding-bottom:8px}.lg{font-weight:700;letter-spacing:4px;color:#1B4B5A;font-size:15px}
  .izlogo{height:38px;width:auto;display:block;margin-bottom:6px}.izlogo .izl1{fill:#51658d}.izlogo .izl2{fill:#575656}.pln{background:#f4f2ee;border-radius:8px;padding:8px 8px 4px;margin-bottom:6px}.bar h1{margin:4px 0 0;font-size:19px;font-weight:600}.meta{text-align:right;color:#77726b;font-size:10px;line-height:1.5}
  .pbtn{position:fixed;right:16px;bottom:16px;box-shadow:0 6px 18px -6px rgba(45,42,36,.5);background:#1B4B5A;color:#fff;border:0;border-radius:8px;padding:9px 14px;font:600 12px Jost,Inter,Arial;cursor:pointer}
  .g2{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;margin-top:12px}h3{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#77726b;margin:9px 0 5px}
  .shot{width:100%;height:62mm;object-fit:cover;border-radius:8px;border:1px solid #e4dfd8;display:block}
  table{width:100%;border-collapse:collapse}td,th{padding:3px 0;border-bottom:1px solid #e4dfd8;text-align:left;vertical-align:top}.kv td:last-child{text-align:right;font-weight:600}.kv tr.k td{color:#1B4B5A;font-weight:700;font-size:11.5px}
  .cm th{font-size:9.5px;color:#77726b}.cm td+td,.cm th+th{text-align:right;padding-left:8px}
  .pv{margin-top:8px;padding:8px 10px;border-radius:8px;font-weight:700;background:${PVC[pv][1]};color:${PVC[pv][0]}}
  .sec{background:#f4f2ee;border-radius:8px;padding:8px;display:flex;justify-content:center}.leg{font-size:9px;color:#77726b;display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}.leg span{display:flex;align-items:center;gap:4px}.leg i{display:inline-block;width:14px;border-top:2px solid}
  ul{padding-left:15px;margin:0}li{font-size:9px;color:#4b5563;line-height:1.4;margin-bottom:2px}.disc{margin-top:8px;font-size:9px;color:#948d83}
  .ft{margin-top:12px;border-top:1px solid #e4dfd8;padding-top:6px;display:flex;justify-content:space-between;color:#77726b;font-size:9.5px}
  @media screen{body{padding:28px;max-width:960px;margin:0 auto}}@media print{.pbtn{display:none}}`;
  return `<!doctype html><html lang="${l}"><head><meta charset="utf-8"><title>İzofleks – ${x.rTitle}</title><link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet"><style>${css}</style></head><body>
  <button class="pbtn" onclick="print()">${x.rPrint}</button>
  <div class="bar"><div>${(document.querySelector('.izlogo')||{outerHTML:''}).outerHTML}<h1>${x.rTitle}</h1></div><div class="meta">${x.rDate}: ${date}<br>izofleks.com.tr · info@izofleks.com.tr</div></div>
  <div class="g2"><div><h3>${x.rPlan}</h3>${plan}<h3>${x.rOct}</h3>${octSvg(A,B,420,170)}<div class="leg">${octLegend(A,B)}</div></div>
  <div><h3>${x.rCfg}</h3>${cfgT}<h3>${x.rRes}</h3>${resT}<div class="pv">${x.pvTitle}: ${x.pvR[pv]}</div><h3>${x.rSec} · ${A.c.sys}</h3><div class="sec">${sec}</div></div></div>
  ${cmp}<h3>${x.rBasis}</h3><ul>${t.basis.map(b=>'<li>'+b+'</li>').join('')}<li>${x.pvN}</li><li>${x.oNote}</li></ul><div class="disc">${x.rDisc}</div>
  <div class="ft"><span>İzofleks · ${l==='tr'?'Camlı ofis bölme sistemleri':'Glass office partition systems'}</span><span>izofleks.com.tr</span></div>
  <script>window.addEventListener('load',()=>setTimeout(()=>{try{print()}catch(e){}},700));<\/script></body></html>`;
}
function openReport(){
  const h=reportHTML();let w=null;
  try{w=window.open(URL.createObjectURL(new Blob([h],{type:'text/html'})),'_blank');}catch(e){}
  if(!w){const f=document.createElement('iframe');f.style.cssText='position:fixed;width:0;height:0;border:0;left:-9999px';document.body.appendChild(f);
    f.contentDocument.open();f.contentDocument.write(h.replace(/<script>[\s\S]*?<\/script>/,''));f.contentDocument.close();setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print();setTimeout(()=>f.remove(),2000);},900);}
}

<script>
(function(){
  const q=new URLSearchParams(location.search), norm=v=>{v=String(v||'').toUpperCase();v=v.replace(/[\s_-]/g,'');return ['A42','A100','KKB60','KKB80'].includes(v)?v:null;};
  const TX={tr:['Cam bölme ses yalıtımı simülatörü','A42, A100 ve KKB (kayar-katlanır) sistemlerinde cam, kapı ve giyotin seçin; Rw değerlerini, konuşma gizliliğini ve bölmeden geçen sesi 3B olarak görün.','Simülatörü başlat','Yükleniyor…','Teorik değerler · TS EN ISO 717-1'],
          en:['Glass partition sound insulation simulator','Choose glass, door and drop seal for the A42, A100 and KKB (sliding-folding) systems; see Rw values, speech privacy and the sound passing through the partition in 3D.','Start the simulator','Loading…','Theoretical values · EN ISO 717-1']};
  let started=false;
  window.__izfSys=norm(q.get('sys')); window.__izfLang=(q.get('lang')||'tr').slice(0,2).toLowerCase();
  const $=id=>document.getElementById(id);
  function txt(){const t=TX[window.__izfLang==='en'?'en':'tr'];$('pT').textContent=t[0];$('pS').textContent=t[1];$('posterBtn').textContent=started?t[3]:t[2];$('pN').textContent=t[4];}
  function load(u){return new Promise((res,rej)=>{const e=document.createElement('script');e.src=u;e.onload=res;e.onerror=rej;document.head.appendChild(e);});}
  async function start(){
    if(started)return; started=true; txt();
    try{await load('https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js');await load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');}
    catch(e){started=false;txt();return;}
    window.__izfMain(); const p=$('poster'); if(p)p.remove();
  }
  window.addEventListener('message',e=>{const d=e.data;if(!d||typeof d!=='object')return;
    if(d.izfLang&&!started){window.__izfLang=String(d.izfLang).slice(0,2).toLowerCase();txt();}
    const s=norm(d.izfSys); if(s){if(started&&window.__izfSetSys)window.__izfSetSys(s);else{window.__izfSys=s;start();}}
    if(d.izfStart)start();});
  $('posterBtn').onclick=start; txt();
  start();
  try{window.parent.postMessage({izfReady:true},'*');}catch(e){}
})();
</script>
